CVE-2025-27840:
  cpes:
    - cpe: cpe:2.3:o:espressif:esp32_firmware:-:*:*:*:*:*:*:*
  reason: >-
    A security issue was reported concerning undocumented HCI commands in ESP32
    Bluetooth controller. Espressif had earlier clarified that these vendor HCI
    commands are primarily used for debugging purposes and pose no real, known
    security threat. Technical details were shared in this
    https://developer.espressif.com/blog/2025/03/esp32-bluetooth-clearing-the-air/

CVE-2025-55297:
  cpes:
    - cpe: cpe:2.3:a:espressif:esp-idf:*:*:*:*:*:*:*:*
      versionStartIncluding: '5.2.6'
      versionEndExcluding: '5.3'
  reason: >-
    Memory overflows in the BluFi example, fixed on the ESP-IDF 5.2 release
    line since v5.2.6 (commits bf50c0c197af and e65cf7ea2a2b). NVD's affected
    range for the 5.2 line ([5.2, 5.3.3)) was assigned before v5.2.6 was
    released and never narrowed, so the fixed v5.2.6/v5.2.7 releases and the
    release/v5.2 branch are still reported. The other release lines are
    matched correctly (fixed in 5.0.9, 5.1.6, 5.3.3 and 5.4.1).
    https://github.com/espressif/esp-idf/security/advisories/GHSA-9w88-r2vm-qfc4

CVE-2026-40930:
  cpes:
    - cpe: cpe:2.3:a:pnggroup:libpng:*:*:*:*:*:*:*:*
      versionEndExcluding: '1.8.0'
    - cpe: cpe:2.3:a:libpng:libpng:*:*:*:*:*:*:*:*
      versionEndExcluding: '1.8.0'
  reason: >-
    Chunk-discard flaws in the push-mode APNG parser introduced in libpng
    1.8.0. Older release lines, such as the 1.6.x line bundled by the
    idf-extra-components libpng component, do not contain the APNG push-mode
    code.

