CVE-2026-77234:
  cpes:
    - cpe: cpe:2.3:o:amazon:freertos:*:*:*:*:*:*:*:*
      versionStartIncluding: '7.0.0'
      versionEndIncluding: '11.3.0'
  reason: >-
    A timer command submitted by an unprivileged task is executed by the timer
    service task as a caller-supplied function call. Affects only MPU-enabled
    ports (GHSA-w3vr-pr75-5hc6). ESP-IDF ships the xtensa, riscv and linux
    ports only, none of which set portUSING_MPU_WRAPPERS, so the MPU wrappers
    and the privilege boundary they enforce are not built. Same reasoning as
    CVE-2024-28115, already excluded in the FreeRTOS-Kernel manifest.

CVE-2026-77237:
  cpes:
    - cpe: cpe:2.3:o:amazon:freertos:*:*:*:*:*:*:*:*
      versionStartIncluding: '7.4.0'
      versionEndIncluding: '11.3.0'
  reason: >-
    Missing queue-set type validation in xQueueAddToSet() leading to an
    out-of-bounds read in privileged kernel context. Affects only MPU-enabled
    ports with configUSE_QUEUE_SETS=1 (GHSA-9wvc-hqvx-5wf5). ESP-IDF ships the
    xtensa, riscv and linux ports only, none of which set
    portUSING_MPU_WRAPPERS, so there is no privileged/unprivileged split for
    the over-read to cross.

CVE-2026-77235:
  cpes:
    - cpe: cpe:2.3:o:amazon:freertos:*:*:*:*:*:*:*:*
      versionStartIncluding: '10.2.0'
      versionEndIncluding: '11.3.0'
  reason: >-
    Missing privilege verification in the secure context cleanup SVC handler,
    letting a Non-Secure task free another task's secure context
    (GHSA-55pf-q87x-c58c). Affects ARMv8-M ports with TrustZone and MPU only.
    ESP-IDF ships the xtensa, riscv and linux ports only and carries no
    secure_context sources, so the affected code is not present.

CVE-2026-77236:
  cpes:
    - cpe: cpe:2.3:o:amazon:freertos:*:*:*:*:*:*:*:*
      versionStartIncluding: '10.2.0'
      versionEndIncluding: '11.3.0'
  reason: >-
    Missing minimum size validation in secure context allocation, writing the
    stack-overflow sentinel outside the allocated Secure-world buffer
    (GHSA-vq2f-9qj3-jj2m). Affects ARMv8-M ports with TrustZone only. ESP-IDF
    ships the xtensa, riscv and linux ports only and carries no secure_context
    sources, so the affected code is not present.

CVE-2026-75466:
  cpes:
    - cpe: cpe:2.3:a:libjpeg-turbo:libjpeg-turbo:*:*:*:*:*:*:*:*
      versionEndExcluding: '3.2.0'
    - cpe: cpe:2.3:a:d.r.commander:libjpeg-turbo:*:*:*:*:*:*:*:*
      versionEndExcluding: '3.2.0'
  reason: >-
    Division by zero in the indexed-color branch of the PNG loader
    (src/rdpng.c) reached through the TurboJPEG API tj3LoadImage12() and
    tj3LoadImage16(). The PNG loader was added in the 3.2 line; the 3.1.x line
    bundled by the idf-extra-components libjpeg-turbo component has no
    src/rdpng.c, and the component builds with WITH_TURBOJPEG=FALSE, so the
    TurboJPEG API is not built at all.

