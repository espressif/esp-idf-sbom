      versionStartIncluding: '5.2.6'
      versionEndExcluding: '5.3'
  reason: >-
    Memory overflows in the BluFi example, fixed on the ESP-IDF 5.2 release
    line since v5.2.6 (commits bf50c0c197af and e65cf7ea2a2b). NVD's affected
    range for the 5.2 line ([5.2, 5.3.3)) was assigned before v5.2.6 was
    released and never narrowed, so the fixed v5.2.6/v5.2.7 releases and the
    release/v5.2 branch are still reported. The other release lines are
    matched correctly (fixed in 5.0.9, 5.1.6, 5.3.3 and 5.4.1).
