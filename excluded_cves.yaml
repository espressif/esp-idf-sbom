CVE-2026-89598: Related to the Linux kernel ssd1307fb fbdev driver, which runs sleeping I2C transfers from atomic context in its damage callbacks. Matched on "lz4" in the module list of the crash report; not a vulnerability in the LZ4 C library

CVE-2026-54571: Related to ESP32Async ESPAsyncWebServer (< 3.11.1), whose multipart/form-data parser keeps _boundaryPosition in an 8-bit field, so a 256-byte boundary wraps it to zero and the parse loop never ends until the watchdog resets the device. A third party Arduino library, not a vulnerability in ESP-IDF or in the FreeRTOS kernel
CVE-2026-15924: Related to Zephyr's TLS socket layer (subsys/net/lib/sockets/sockets_tls.c), whose process-global client_cache is serialized only by the per-socket ctx->lock, so two sockets can free and read the same session buffer. Not a vulnerability in mbedTLS itself
