CVE-2020-22283:
    cpes:
      - cpe: cpe:2.3:a:lwip_project:lwip:*:*:*:*:*:*:*:*
        versionStartIncluding: '2.1.3'
    reason: >-
      ICMPv6 out-of-bounds read (savannah #58553) in
      icmp6_send_response_with_addrs_and_netif(). Fixed upstream by commits
      489405839ae0 and 488d4ad2460c (lwIP 2.1.3/2.2.0), further hardened by
      2bf8fcd7c240; all present as ancestors in the vendored esp-lwip fork. NVD's
      CPE has no fixed-version boundary ("git head"), causing the version match.
