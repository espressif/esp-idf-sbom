CVE-2026-46387: Related to Suricata (< 7.0.16 and < 8.0.5), whose HTTP/2 decompression path grows the decompressed response body buffer without an upper bound for gzip, deflate or brotli payloads. Not a vulnerability in the brotli C library
CVE-2026-80710: Related to the Linux kernel s390 DASD driver, where the int-typed fmt_buffer_size in dasd_eckd_check_device_format() truncates the buffer size and the channel program writes past the undersized allocation. Matched on the "fmt" keyword; not a vulnerability in the C++ fmtlib/fmt library
CVE-2026-85024: Related to the undici WebSocket client, whose permessage-deflate size-limit cleanup removes the error listener from its zlib inflate stream so a malformed DEFLATE byte crashes the Node.js process. Same class as CVE-2026-2229, already excluded. Not a vulnerability in the zlib C library
CVE-2026-87776: Related to the Node.js compression middleware (< 1.8.2), which never destroys the zlib stream of a compressed response when the client aborts the connection and so leaks native zlib memory. Not a vulnerability in the zlib C library
